services:
  - type: web
    name: nutrilog-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nutrilog-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://nutrilog.vercel.app

databases:
  - name: nutrilog-db
    databaseName: nutrilog
    user: nutrilog
    plan: free
    region: oregon
